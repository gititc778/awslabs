server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the static UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the Flask backend service.
    # /api/employees  ->  http://python-app:8080/employees
    # Uses a variable + resolver so nginx starts even if the
    # backend isn't up yet (no boot-time DNS failure).
    location /api/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s;
        set $backend "python-app.dev.svc.cluster.local:8080";
        proxy_pass http://$backend/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Health endpoint for k8s probes (served by nginx itself)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
